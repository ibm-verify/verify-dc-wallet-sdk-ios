name: "Run MEND scan"

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  WS_APIKEY: ${{ secrets.WS_APIKEY }}
  WS_USERKEY: ${{ secrets.WS_USERKEY }}
  WS_PRODUCTNAME: ${{ secrets.WS_PRODUCTNAME }}
  WS_PROJECTNAME: ${{ secrets.WS_PROJECTNAME }}
  WS_WSS_URL: ${{ secrets.WS_WSS_URL }}

jobs:
  mend-scan:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (required by Mend unified agent)
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'microsoft'

      - name: Download Mend unified agent
        run: |
          curl -LJO https://unified-agent.s3.amazonaws.com/wss-unified-agent.jar

      - name: Run Mend scan
        run: |
          java -jar wss-unified-agent.jar -d ${{ github.workspace }}
